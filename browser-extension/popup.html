<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>雀魂牌譜キャプチャ</title>
<style>
  body { width: 320px; font-family: sans-serif; font-size: 13px; padding: 10px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #status { margin-bottom: 8px; white-space: pre-wrap; line-height: 1.5; }
  button { margin-right: 4px; margin-bottom: 4px; }
  .warn { color: #a33; font-size: 11px; margin-top: 8px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>雀魂牌譜キャプチャ(非公式・個人利用)</h1>
  <div id="status">読み込み中...</div>
  <button id="start">キャプチャ開始</button>
  <button id="stop">停止</button>
  <button id="clear">クリア</button>
  <button id="export">JSONエクスポート</button>
  <div class="warn">
    対局終了後の牌譜(リプレイ、URLに paipu= を含む画面)でのみ動作します。
    対局中の使用・自動連続キャプチャは想定していません。取得したJSONは自分自身の
    振り返り目的以外に使用しないでください。
  </div>
  <script src="popup.js"></script>
</body>
</html>
